    <!-- =====================================================
         Initial browser canvas / theme bootstrap
         ===================================================== -->
    <script>
      (() => {
        try {
          const savedTheme = sessionStorage.getItem('theme');
          const theme = savedTheme === 'light' ? 'light' : 'dark';
          const isDark = theme === 'dark';
          const isProductDetail = window.location.pathname.startsWith('/product/');
          const pageBackground = isDark ? '#121212' : '#ffffff';
          const overlayBackground = isDark ? '#0a0a0a' : '#ffffff';
          const safeAreaBackground = isProductDetail ? overlayBackground : pageBackground;

          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.classList.toggle('product-detail-open', isProductDetail);
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.backgroundColor = pageBackground;
          document.documentElement.style.setProperty('--app-background', pageBackground);
          document.documentElement.style.setProperty('--safe-area-background', safeAreaBackground);
          document.documentElement.style.setProperty('--footer-background', pageBackground);
          document.documentElement.style.setProperty('--mobile-menu-background', overlayBackground);
          document.documentElement.style.setProperty('--cart-background', overlayBackground);
          document.documentElement.style.setProperty('--browser-chrome-background', safeAreaBackground);
        } catch {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.style.backgroundColor = '#121212';
          document.documentElement.style.setProperty('--app-background', '#121212');
          document.documentElement.style.setProperty('--safe-area-background', '#121212');
          document.documentElement.style.setProperty('--footer-background', '#121212');
          document.documentElement.style.setProperty('--mobile-menu-background', '#0a0a0a');
          document.documentElement.style.setProperty('--cart-background', '#0a0a0a');
          document.documentElement.style.setProperty('--browser-chrome-background', '#121212');
        }
      })();
    </script>
